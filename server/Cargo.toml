[package]
name = "tandem-server"
version = "0.8.1"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash", "std"] }
axum = { version = "0.8.9", features = ["ws"] }
ciborium = "0.2.2"
clap = { version = "4.6.7", features = ["derive", "env"] }
ed25519-dalek = "3"
futures-util = "0.3.34"
hex = "0.4.3"
hmac = { version = "0.12", default-features = false }
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "std"] }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rand = "0.10.3"
rsa = { version = "0.9.10", default-features = false, features = ["std", "sha2"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = { version = "0.10", default-features = false }
sha2 = "0.11.1"
similar = { version = "3.2.1", default-features = false, features = ["text"] }
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
yrs = "0.28.0"

[profile.release]
strip = true
lto = true
codegen-units = 1
